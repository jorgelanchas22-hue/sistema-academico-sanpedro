<style>
  :root{
    --rojo:#dc2626; --rojo-oscuro:#b91c1c; --azul:#2563eb; --azul-oscuro:#1d4ed8;

  }
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f9fafb;color:#1f2937;}
  .oculto{display:none !important;}

  header{background:#fff;border-bottom:4px solid var(--rojo);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header .logo{color:var(--rojo);font-weight:bold;font-size:22px;line-height:1.1;}
  header .logo span{font-size:13px;font-weight:normal;display:block;}
  header .titulo{font-size:18px;font-weight:600;color:#1f2937;}
  .estado{font-size:12px;padding:4px 10px;border-radius:999px;}
  .estado.demo{background:#fef3c7;color:#92400e;}
  .estado.online{background:#d1fae5;color:#065f46;}

  main{max-width:1100px;margin:0 auto;padding:24px;}

  nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  nav button{padding:10px 16px;border-radius:8px;border:1px solid var(--gris-300);background:#fff;cursor:pointer;font-size:14px;font-weight:500;}
  nav button.activo-azul{background:var(--azul);color:#fff;border-color:var(--azul);}
  nav button.activo-rojo{background:var(--rojo);color:#fff;border-color:var(--rojo);}
  nav button.activo-verde{background:#059669;color:#fff;border-color:#059669;}

  .card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:24px;margin-bottom:20px;}
  .card h2{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:4px;}
  select,input[type=text],textarea{width:100%;padding:9px;border:1px solid var(--gris-300);border-radius:6px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;}

  .btn{padding:9px 18px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
  .btn-rojo{background:var(--rojo);color:#fff;} .btn-rojo:hover{background:var(--rojo-oscuro);}
  .btn-azul{background:var(--azul);color:#fff;} .btn-azul:hover{background:var(--azul-oscuro);}
  .btn-gris{background:var(--gris-200);color:#374151;}
  .btn-verde{background:#059669;color:#fff;}
  .btn-peq{padding:6px 10px;border-radius:6px;border:none;background:none;cursor:pointer;}
  .btn-peq:hover{background:var(--gris-100);}

  .item-lista{border:1px solid var(--gris-200);border-radius:8px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .item-lista .info h3{margin:0 0 6px;font-size:16px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px;}
  .badge-ini{background:var(--gris-100);color:#374151;font-family:monospace;}
  .badge-rojo{background:#fee2e2;color:#991b1b;}
  .badge-azul{background:#dbeafe;color:#1e40af;}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:13px;color:#4b5563;margin-top:6px;}
  .acciones{display:flex;gap:4px;align-items:flex-start;}

  .aspecto{border:1px solid var(--gris-200);border-radius:8px;padding:14px;margin-bottom:12px;}
  .aspecto-cabecera{display:flex;gap:8px;margin-bottom:8px;}
  .aspecto-cabecera input{border:none;border-bottom:1px solid var(--gris-300);font-weight:600;padding:4px 0;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px;}
  .stat{border-radius:10px;padding:20px;text-align:center;}
  .stat .n{font-size:28px;font-weight:bold;}
  .stat.rojo{background:#fef2f2;color:var(--rojo);} .stat.azul{background:#eff6ff;color:var(--azul);}
  .stat.verde{background:#ecfdf5;color:#059669;} .stat.morado{background:#f5f3ff;color:#7c3aed;}

  .vacio{text-align:center;padding:40px;color:#9ca3af;}
  .nota{border-left:4px solid var(--azul);background:#eff6ff;padding:10px 14px;border-radius:6px;font-size:13px;color:#1e40af;margin-bottom:14px;}
  footer{text-align:center;color:#fff;background:#1f2937;padding:16px;font-size:12px;margin-top:30px;}
</style>
</head>

function iniciarApp(){
  document.getElementById('estadoConexion').textContent = modoFirebase ? 'Conectado a Firebase' : 'Modo demo (local)';
  document.getElementById('estadoConexion').className = 'estado ' + (modoFirebase ? 'online' : 'demo');

  if(modoFirebase){
    db.ref('registros').on('value', snap=>{ registros = objAArray(snap.val()); if(vista==='registros'||vista==='dashboard') render(); });
    db.ref('programas').on('value', snap=>{ programas = objAArray(snap.val()); if(vista==='programas'||vista==='dashboard') render(); });
    db.ref('alumnos').once('value', snap=>{
      if(snap.val()){ alumnosPorCurso = snap.val(); }
      else { alumnosPorCurso = alumnosPorCursoDefecto; db.ref('alumnos').set(alumnosPorCurso); }
      db.ref('alumnos').on('value', s=>{ alumnosPorCurso = s.val()||{}; if(vista==='alumnos') render(); });
      render();
    });
  } else {
    registros = JSON.parse(localStorage.getItem('sanpedro_registros')||'[]');
    programas = JSON.parse(localStorage.getItem('sanpedro_programas')||'[]');
    const guardados = localStorage.getItem('sanpedro_alumnos');
    alumnosPorCurso = guardados ? JSON.parse(guardados) : alumnosPorCursoDefecto;
    render();
  }
}
function objAArray(obj){
  if(!obj) return [];
  return Object.keys(obj).map(k=>({...obj[k], _key:k}));
}
function guardarColeccion(nombre, arr){
  if(!modoFirebase){
    localStorage.setItem('sanpedro_'+nombre, JSON.stringify(arr));
  }
}
function guardarAlumnos(){
  if(modoFirebase){
    db.ref('alumnos').set(alumnosPorCurso);
  } else {
    localStorage.setItem('sanpedro_alumnos', JSON.stringify(alumnosPorCurso));
  }
}

function iniciales(nombre){
  if(!nombre) return 'SA';
  const partes = nombre.trim().split(/[\s,]+/).filter(Boolean);
  return partes.slice(0,4).map(p=>p.charAt(0).toUpperCase()).join('') || 'SA';
}
function primerTrozo(nombre){
  return nombre.split(',')[0]?.trim() || nombre.split(' ')[0];
}
function nombreCursoLegible(c){
  return c + ' ESO';
}
function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function irVista(v){ vista=v; mostrandoPreview=false; render(); }
function nuevoRegistro(){
  modoEdicion=false; mostrandoPreview=false;

}
function nuevoPrograma(){
  modoEdicion=false;

  programaActual = { id:null, tipoPrograma:'', tipoPersonalizado:'', curso:'', alumno:'', asignatura:'', ...base };
  vista='formPrograma'; render();
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.className='');
  const mapa = {programas:'navProgramas', registros:'navRegistros', dashboard:'navDashboard', formPrograma:'navNuevoPrograma', formRegistro:'navNuevoRegistro', alumnos:'navAlumnos'};
  const colores = {navProgramas:'activo-azul', navRegistros:'activo-rojo', navDashboard:'activo-verde', navNuevoPrograma:'activo-azul', navNuevoRegistro:'activo-rojo', navAlumnos:'activo-verde'};
  const activoId = mapa[vista];
  if(activoId) document.getElementById(activoId).className = colores[activoId];

  const cont = document.getElementById('contenido');
  if(vista==='programas') cont.innerHTML = vistaListaProgramas();
  else if(vista==='registros') cont.innerHTML = vistaListaRegistros();
  else if(vista==='dashboard') cont.innerHTML = vistaDashboard();
  else if(vista==='alumnos') cont.innerHTML = vistaGestionAlumnos();
  else if(vista==='formPrograma') cont.innerHTML = mostrandoPreview ? previewPrograma() : formPrograma();
  else if(vista==='formRegistro') cont.innerHTML = mostrandoPreview ? previewRegistro() : formRegistro();
}

function vistaDashboard(){
  const totalAlumnos = Object.values(alumnosPorCurso).reduce((t,a)=>t+a.length,0);
  return `
  <div class="card">
    <h2>Dashboard</h2>
    <div class="stats">
      <div class="stat rojo"><div class="n">${registros.length}</div>Registros de Seguimiento</div>
      <div class="stat azul"><div class="n">${programas.length}</div>Programas Educativos</div>
      <div class="stat verde"><div class="n">${totalAlumnos}</div>Total Alumnos</div>
      <div class="stat morado"><div class="n">${cursos.length}</div>Cursos Disponibles</div>
    </div>
  </div>`;
}

function añadirAlumno(){
  const input = document.getElementById('nuevoAlumnoInput');
  const nombre = input.value.trim();
  if(!nombre){ alert('Escribe el nombre del alumno'); return; }
  if(!alumnosPorCurso[cursoSeleccionadoGestion]) alumnosPorCurso[cursoSeleccionadoGestion] = [];
  alumnosPorCurso[cursoSeleccionadoGestion].push(nombre);
  alumnosPorCurso[cursoSeleccionadoGestion].sort((a,b)=>a.localeCompare(b,'es'));
  guardarAlumnos();
  render();
}

function importarListaAlumnos(reemplazar){
  const textarea = document.getElementById('listaAlumnosInput');
  const texto = textarea.value.trim();
  if(!texto){ alert('Pega primero la lista de alumnos, un nombre por línea'); return; }

  const nombresNuevos = texto.split('\n').map(l=>l.trim()).filter(l=>l.length>0);

  if(nombresNuevos.length === 0){ alert('No se ha detectado ningún nombre válido'); return; }

  if(reemplazar){
    if(!confirm(`Esto va a reemplazar toda la lista de ${nombreCursoLegible(cursoSeleccionadoGestion)} (${(alumnosPorCurso[cursoSeleccionadoGestion]||[]).length} alumnos actuales) por ${nombresNuevos.length} alumnos nuevos. ¿Continuar?`)) return;
    alumnosPorCurso[cursoSeleccionadoGestion] = [...nombresNuevos].sort((a,b)=>a.localeCompare(b,'es'));
  } else {
    if(!alumnosPorCurso[cursoSeleccionadoGestion]) alumnosPorCurso[cursoSeleccionadoGestion] = [];
    const existentes = new Set(alumnosPorCurso[cursoSeleccionadoGestion]);
    let añadidos = 0;
    nombresNuevos.forEach(n=>{
      if(!existentes.has(n)){ alumnosPorCurso[cursoSeleccionadoGestion].push(n); existentes.add(n); añadidos++; }
    });
    alumnosPorCurso[cursoSeleccionadoGestion].sort((a,b)=>a.localeCompare(b,'es'));
    alert(`Añadidos ${añadidos} alumnos nuevos (${nombresNuevos.length - añadidos} ya estaban en la lista y se han ignorado).`);
  }

  textarea.value = '';
  guardarAlumnos();
  render();
}

function eliminarAlumno(i){
  if(!confirm('¿Eliminar este alumno de la lista? (No borra sus registros o programas ya creados)')) return;
  alumnosPorCurso[cursoSeleccionadoGestion].splice(i,1);
  guardarAlumnos();
  render();
}

function descargarHTML(nombreArchivo, contenido){
  const blob = new Blob([contenido], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=nombreArchivo+'.html'; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
