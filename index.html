function iniciarGoogleDrive(){
  if(!GOOGLE_DRIVE_ACTIVADO) return;
  gapi.load('client', async () => {
    await gapi.client.init({ apiKey: GOOGLE_API_KEY });
    await gapi.client.load('drive', 'v3');

        driveListo = true;

      }
    });

}
function conectarDrive(){

function actualizarEstadoDrive(){
  const el = document.getElementById('estadoDrive');
  if(el) el.textContent = driveListo ? 'Drive conectado' : 'Drive no conectado';
}

async function obtenerOCrearCarpeta(nombre, idPadre){
  const q = `mimeType='application/vnd.google-apps.folder' and name='${nombre.replace(/'/g,"\\'")}' and '${idPadre}' in parents and trashed=false`;
  const res = await gapi.client.drive.files.list({ q, fields: 'files(id, name)' });
  if(res.result.files && res.result.files.length > 0) return res.result.files[0].id;
  const crear = await gapi.client.drive.files.create({
    resource: { name: nombre, mimeType: 'application/vnd.google-apps.folder', parents: [idPadre] },
    fields: 'id'
  });
  return crear.result.id;
}

async function subirArchivoADrive(nombreArchivo, contenidoHTML, curso, alumno){
  if(!driveListo){ alert('Conecta Google Drive primero (botón arriba a la derecha).'); return false; }
  try{
    const idRaiz = await obtenerOCrearCarpeta(CARPETA_RAIZ_DRIVE, 'root');
    const idCurso = await obtenerOCrearCarpeta(nombreCursoLegible(curso) || 'Sin curso', idRaiz);
    const nombreCarpetaAlumno = `${iniciales(alumno)}_${primerTrozo(alumno)}`;
    const idCarpetaAlumno = await obtenerOCrearCarpeta(nombreCarpetaAlumno, idCurso);

    const boundary = '-------314159265358979323846';
    const metadata = { name: nombreArchivo + '.html', parents: [idCarpetaAlumno], mimeType: 'text/html' };
    const multipartBody =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: text/html\r\n\r\n${contenidoHTML}\r\n--${boundary}--`;

    await gapi.client.request({
      path: '/upload/drive/v3/files',
      method: 'POST',
      params: { uploadType: 'multipart' },
      headers: { 'Content-Type': `multipart/related; boundary="${boundary}"` },
      body: multipartBody
    });
    return true;
  } catch(e){
    console.error('Error subiendo a Drive', e);
    alert('Error al subir el archivo a Drive. Revisa la consola para más detalles.');
    return false;
  }
}

/* =========================================================
   INICIO / PERSISTENCIA
========================================================= */
function iniciarApp(){
  document.getElementById('estadoConexion').textContent = modoFirebase ? 'Conectado a Firebase' : 'Modo demo (local)';
  document.getElementById('estadoConexion').className = 'estado ' + (modoFirebase ? 'online' : 'demo');

  if(modoFirebase){
    db.ref('registros').on('value', snap=>{ registros = objAArray(snap.val()); if(vista==='registros'||vista==='dashboard') render(); });
    db.ref('programas').on('value', snap=>{ programas = objAArray(snap.val()); if(vista==='programas'||vista==='dashboard') render(); });
    db.ref('alumnos').once('value', snap=>{
      const val = snap.val();
      if(val && Object.keys(val).length > 0){ alumnosPorCurso = val; }
      else { alumnosPorCurso = alumnosPorCursoDefecto; db.ref('alumnos').set(alumnosPorCurso); }
      db.ref('alumnos').on('value', s=>{ const v=s.val(); if(v && Object.keys(v).length>0) alumnosPorCurso = v; if(vista==='alumnos') render(); });
      render();
    });
    db.ref('plantillas').once('value', snap=>{
      const val = snap.val();
      if(val && Object.keys(val).length > 0){ plantillasPorTipoPrograma = val; }
      else { plantillasPorTipoPrograma = plantillasPorTipoProgramaDefecto; db.ref('plantillas').set(plantillasPorTipoPrograma); }
      db.ref('plantillas').on('value', s=>{ const v=s.val(); if(v && Object.keys(v).length>0) plantillasPorTipoPrograma = v; if(vista==='plantillas') render(); });
      render();
    });
  } else {
    registros = JSON.parse(localStorage.getItem('sanpedro_registros')||'[]');
    programas = JSON.parse(localStorage.getItem('sanpedro_programas')||'[]');
    const guardados = localStorage.getItem('sanpedro_alumnos');
    alumnosPorCurso = guardados ? JSON.parse(guardados) : alumnosPorCursoDefecto;
    const plantillasGuardadas = localStorage.getItem('sanpedro_plantillas');
    plantillasPorTipoPrograma = plantillasGuardadas ? JSON.parse(plantillasGuardadas) : plantillasPorTipoProgramaDefecto;
    render();
  }
}
function objAArray(obj){
  if(!obj) return [];
  return Object.keys(obj).map(k=>({...obj[k], _key:k}));
}
function guardarColeccion(nombre, arr){
  if(!modoFirebase){
    localStorage.setItem('sanpedro_'+nombre, JSON.stringify(arr));
  }
}
function guardarAlumnos(){
  if(modoFirebase){ db.ref('alumnos').set(alumnosPorCurso); }
  else { localStorage.setItem('sanpedro_alumnos', JSON.stringify(alumnosPorCurso)); }
}
function guardarPlantillas(){
  if(modoFirebase){ db.ref('plantillas').set(plantillasPorTipoPrograma); }
  else { localStorage.setItem('sanpedro_plantillas', JSON.stringify(plantillasPorTipoPrograma)); }
}

/* =========================================================
   UTILIDADES
========================================================= */
function iniciales(nombre){
  if(!nombre) return 'SA';
  const partes = nombre.trim().split(/[\s,]+/).filter(Boolean);
  return partes.slice(0,4).map(p=>p.charAt(0).toUpperCase()).join('') || 'SA';
}
function primerTrozo(nombre){
  return nombre.split(',')[0]?.trim() || nombre.split(' ')[0];
}
function nombreCursoLegible(c){
  const mapa = {
    '1A':'1º A ESO', '1B':'1º B ESO', '1C':'1º C ESO',
    '2A':'2º A ESO', '2B':'2º B ESO', '2C':'2º C ESO',
    '3A':'3º A ESO', '3B':'3º B ESO', '3C':'3º C ESO',
    '4A':'4º A ESO', '4B':'4º B ESO', '4C':'4º C ESO',
    '1BACH_A':'1º A Bachillerato', '1BACH_B':'1º B Bachillerato', '1BACH_C':'1º C Bachillerato',
    '2BACH_A':'2º A Bachillerato', '2BACH_B':'2º B Bachillerato', '2BACH_C':'2º C Bachillerato'
  };
  return mapa[c] || c;
}
function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function alumnosConProgramaEnCurso(curso){
  if(!curso) return [];
  const nombres = new Set();
  programas.forEach(p=>{ if(p.curso === curso) nombres.add(p.alumno); });
  return [...nombres].sort((a,b)=>a.localeCompare(b,'es'));
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.className='');
  const mapa = {programas:'navProgramas', registros:'navRegistros', dashboard:'navDashboard', formPrograma:'navNuevoPrograma', formRegistro:'navNuevoRegistro', alumnos:'navAlumnos', plantillas:'navPlantillas', formPlantilla:'navPlantillas'};
  const colores = {navProgramas:'activo-azul', navRegistros:'activo-rojo', navDashboard:'activo-verde', navNuevoPrograma:'activo-azul', navNuevoRegistro:'activo-rojo', navAlumnos:'activo-verde', navPlantillas:'activo-azul'};
  const activoId = mapa[vista];
  if(activoId) document.getElementById(activoId).className = colores[activoId];

  const cont = document.getElementById('contenido');
  if(vista==='programas') cont.innerHTML = vistaListaProgramas();
  else if(vista==='registros') cont.innerHTML = vistaListaRegistros();
  else if(vista==='dashboard') cont.innerHTML = vistaDashboard();
  else if(vista==='alumnos') cont.innerHTML = vistaGestionAlumnos();
  else if(vista==='plantillas') cont.innerHTML = vistaListaPlantillas();
  else if(vista==='formPlantilla') cont.innerHTML = formPlantilla();
  else if(vista==='formPrograma') cont.innerHTML = mostrandoPreview ? previewPrograma() : formPrograma();
  else if(vista==='formRegistro') cont.innerHTML = mostrandoPreview ? previewRegistro() : formRegistro();
}

function cambiarCursoGestion(curso){ cursoSeleccionadoGestion = curso; render(); }

function añadirAlumno(){
  const input = document.getElementById('nuevoAlumnoInput');
  const nombre = input.value.trim();
  if(!nombre){ alert('Escribe el nombre del alumno'); return; }
  if(!alumnosPorCurso[cursoSeleccionadoGestion]) alumnosPorCurso[cursoSeleccionadoGestion] = [];
  alumnosPorCurso[cursoSeleccionadoGestion].push(nombre);
  alumnosPorCurso[cursoSeleccionadoGestion].sort((a,b)=>a.localeCompare(b,'es'));
  guardarAlumnos();
  render();
}

function importarListaAlumnos(reemplazar){
  const textarea = document.getElementById('listaAlumnosInput');
  const texto = textarea.value.trim();
  if(!texto){ alert('Pega primero la lista de alumnos, un nombre por línea'); return; }
  const nombresNuevos = texto.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(nombresNuevos.length === 0){ alert('No se ha detectado ningún nombre válido'); return; }

  if(reemplazar){
    if(!confirm(`Esto va a reemplazar toda la lista de ${nombreCursoLegible(cursoSeleccionadoGestion)} (${(alumnosPorCurso[cursoSeleccionadoGestion]||[]).length} alumnos actuales) por ${nombresNuevos.length} alumnos nuevos. ¿Continuar?`)) return;
    alumnosPorCurso[cursoSeleccionadoGestion] = [...nombresNuevos].sort((a,b)=>a.localeCompare(b,'es'));
  } else {
    if(!alumnosPorCurso[cursoSeleccionadoGestion]) alumnosPorCurso[cursoSeleccionadoGestion] = [];
    const existentes = new Set(alumnosPorCurso[cursoSeleccionadoGestion]);
    let añadidos = 0;
    nombresNuevos.forEach(n=>{
      if(!existentes.has(n)){ alumnosPorCurso[cursoSeleccionadoGestion].push(n); existentes.add(n); añadidos++; }
    });
    alumnosPorCurso[cursoSeleccionadoGestion].sort((a,b)=>a.localeCompare(b,'es'));
    alert(`Añadidos ${añadidos} alumnos nuevos (${nombresNuevos.length - añadidos} ya estaban en la lista y se han ignorado).`);
  }
  textarea.value = '';
  guardarAlumnos();
  render();
}

function eliminarAlumno(i){
  if(!confirm('¿Eliminar este alumno de la lista? (No borra sus registros o programas ya creados)')) return;
  alumnosPorCurso[cursoSeleccionadoGestion].splice(i,1);
  guardarAlumnos();
  render();
}

========================================================= */
function guardarRegistro(){
  const r = registroActual;
  if(!r.alumno || !r.area){ alert('Completa al menos alumno y área'); return; }
  const datos = {...r, fecha: r.fecha || new Date().toLocaleDateString('es-ES')};

  if(modoFirebase){
    if(modoEdicion && r._key) db.ref('registros/'+r._key).set(datos);
    else db.ref('registros').push(datos);
  } else {
    if(modoEdicion){ registros = registros.map(x=>x.id===r.id?datos:x); }
    else { datos.id = Date.now(); registros.push(datos); }
    guardarColeccion('registros', registros);
  }
  mostrandoPreview=false; irVista('registros');
}
function editarRegistro(i){
  registroActual = {...registros[i]};
  modoEdicion=true; mostrandoPreview=false; vista='formRegistro'; render();
}
function eliminarRegistro(i){
  if(!confirm('¿Eliminar este registro?')) return;
  const r = registros[i];
  if(modoFirebase && r._key) db.ref('registros/'+r._key).remove();
  else { registros.splice(i,1); guardarColeccion('registros', registros); render(); }
}

function crearRegistroAutomatico(p, idPrograma){
  const evaluaciones = ['Primera evaluación', 'Segunda evaluación', 'Tercera evaluación'];
  evaluaciones.forEach(ev=>{
    const registroNuevo = {
      programaId: idPrograma,
      programa: p.tipoPrograma,
      area: p.asignatura,
      profesor: p.profesor || '',
      alumno: p.alumno,
      curso: p.curso,
      evaluacion: ev,
      aspectos: aspectosDefecto(),
      fecha: new Date().toLocaleDateString('es-ES')
    };
    if(modoFirebase){
      db.ref('registros').push(registroNuevo);
    } else {
      registroNuevo.id = Date.now() + Math.random();
      registros.push(registroNuevo);
    }
  });
  if(!modoFirebase){ guardarColeccion('registros', registros); }
}

function guardarPrograma(){
  const p = programaActual;
  if(!p.alumno || !p.asignatura || !p.tipoPrograma){ alert('Completa tipo de programa, alumno y asignatura'); return; }

  if(!modoEdicion){
    const programasDelAlumno = programas.filter(x => x.alumno === p.alumno);
    const yaTieneExclusivo = programasDelAlumno.some(x => x.tipoPrograma === TIPO_EXCLUSIVO);
    const yaTieneAlguno = programasDelAlumno.length > 0;

    if(yaTieneExclusivo){
      alert(`${p.alumno} ya tiene un programa de PROFUNDIZACIÓN, que es exclusivo. No puede tener ningún otro programa a la vez.`);
      return;
    }
    if(p.tipoPrograma === TIPO_EXCLUSIVO && yaTieneAlguno){
      alert(`${p.alumno} ya tiene otro(s) programa(s) activo(s). PROFUNDIZACIÓN es exclusivo y no se puede combinar con otros programas.`);
      return;
    }
    const mismaAsignaturaMismoTipo = programasDelAlumno.some(x => x.asignatura === p.asignatura && x.tipoPrograma === p.tipoPrograma);
    if(mismaAsignaturaMismoTipo){
      alert(`${p.alumno} ya tiene un programa de tipo "${p.tipoPrograma}" en ${p.asignatura}. Edítalo en vez de crear uno nuevo.`);
      return;
    }
  }

  const datos = {...p, fecha: p.fecha || new Date().toLocaleDateString('es-ES')};
  const esNuevo = !modoEdicion;

  if(modoFirebase){
    if(modoEdicion && p._key){
      db.ref('programas/'+p._key).set(datos);
    } else {
      const nuevaRef = db.ref('programas').push();
      nuevaRef.set(datos).then(()=>{
        if(esNuevo){
          crearRegistroAutomatico(datos, nuevaRef.key);
          alert('Programa guardado. Se han creado automáticamente los 3 registros de seguimiento (1ª, 2ª y 3ª evaluación).');
        }
      });
    }
  } else {
    if(modoEdicion){ programas = programas.map(x=>x.id===p.id?datos:x); }
    else {
      datos.id = Date.now();
      programas.push(datos);
      guardarColeccion('programas', programas);
      if(esNuevo){
        crearRegistroAutomatico(datos, datos.id);
        alert('Programa guardado. Se han creado automáticamente los 3 registros de seguimiento (1ª, 2ª y 3ª evaluación).');
      }
    }
  }
  mostrandoPreview=false; irVista('programas');
}
function editarPrograma(i){
  programaActual = {...programas[i]};
  modoEdicion=true; vista='formPrograma'; render();
}
function eliminarPrograma(i){
  if(!confirm('¿Eliminar este programa? También puedes eliminar por separado sus registros de seguimiento desde la sección Registros.')) return;
  const p = programas[i];
  if(modoFirebase && p._key) db.ref('programas/'+p._key).remove();
  else { programas.splice(i,1); guardarColeccion('programas', programas); render(); }
}

function descargarHTML(nombreArchivo, contenido){
  const blob = new Blob([contenido], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=nombreArchivo+'.html'; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
